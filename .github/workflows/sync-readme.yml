name: Sync README from site

# Regenerate the profile README's Title / Stack / Writing / Research blocks
# from zaherkarp.github.io's sources of truth. Read side needs no token (the
# site repo is public); write side commits to this repo with the built-in
# GITHUB_TOKEN. No secrets.
#
# Cadence: daily, plus a manual "Run workflow" button for an on-demand sync.
# The site changes often (blog posts; weekly citation refresh), so this repo
# keeps getting commits well inside GitHub's 60-day scheduled-workflow
# inactivity window; if a schedule is ever auto-disabled, one manual dispatch
# re-arms it.
on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC (after the site's Sun 06:00 citation refresh)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync-readme.yml"

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Clone the public site (sources of truth; no auth needed)
        run: git clone --depth 1 https://github.com/zaherkarp/zaherkarp.github.io site

      - name: Regenerate README blocks
        run: python scripts/build_readme.py --site site

      - name: Commit on change
        run: |
          if git diff --quiet -- README.md; then
            echo "README already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README from site sources of truth"
          git push
