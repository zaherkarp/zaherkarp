name: Sync README from site

# Regenerate the profile README's Title / Stack / Writing / Research blocks
# from zaherkarp.github.io's sources of truth. The site repo is PRIVATE, so the
# read side needs a token: a fine-grained PAT with read-only Contents access to
# zaherkarp/zaherkarp.github.io, stored here as the SITE_READ_TOKEN secret. The
# write side still commits to this repo with the built-in GITHUB_TOKEN.
#
# NOTE: fine-grained PATs expire. When SITE_READ_TOKEN lapses, the preflight
# step below fails with an explicit message rather than a cryptic git error.
# Reissue the PAT and update the secret; nothing else changes.
#
# Cadence: daily, plus a manual "Run workflow" button for an on-demand sync.
# The site changes often (blog posts; weekly citation refresh), so this repo
# keeps getting commits well inside GitHub's 60-day scheduled-workflow
# inactivity window; if a schedule is ever auto-disabled, one manual dispatch
# re-arms it.
on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC (after the site's Sun 06:00 citation refresh)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync-readme.yml"

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Preflight - site read token present
        env:
          SITE_READ_TOKEN: ${{ secrets.SITE_READ_TOKEN }}
        run: |
          if [ -z "$SITE_READ_TOKEN" ]; then
            echo "::error::SITE_READ_TOKEN is unset or expired. zaherkarp.github.io is private."
            echo "::error::Create a fine-grained PAT with read-only Contents access to"
            echo "::error::zaherkarp/zaherkarp.github.io and store it as the SITE_READ_TOKEN secret."
            exit 1
          fi

      - name: Check out the site (private; read-only PAT)
        uses: actions/checkout@v4
        with:
          repository: zaherkarp/zaherkarp.github.io
          token: ${{ secrets.SITE_READ_TOKEN }}
          path: site
          fetch-depth: 1
          persist-credentials: false

      - name: Regenerate README blocks
        run: python scripts/build_readme.py --site site

      - name: Commit on change
        run: |
          if git diff --quiet -- README.md; then
            echo "README already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README from site sources of truth"
          git push
