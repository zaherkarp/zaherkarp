name: Lint

# CI backstop for the generated-marker contract: the README's injection
# regions must stay paired and intact so the sync generator can't corrupt the
# file. Stdlib only, no deps.
on:
  pull_request: {}
  push:
    branches: [main]

# Least-privilege token (2026-11-27). This workflow only reads the repo
# (checkout, build, test), so its GITHUB_TOKEN gets read access to contents
# and nothing else. Without this block the token falls back to the repo's
# default setting, which can be read/write; declaring it here makes the
# workflow safe whatever that setting is. Uploading and downloading
# artifacts and using the Actions cache need no token scopes.
permissions:
  contents: read

jobs:
  markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Marker integrity
        run: python scripts/lint_markers.py
